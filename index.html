<!DOCTYPE html>
<html lang="sr">

<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1">

<title>Skener računa</title>

<script src="https://unpkg.com/@zxing/browser@0.2.1"></script>

<style>

body {
  font-family: Arial, sans-serif;
  max-width: 600px;
  margin: auto;
  padding: 15px;
  background: #f5f5f5;
}

h2 {
  text-align: center;
}

button {
  width: 100%;
  padding: 17px;
  margin-top: 12px;
  font-size: 18px;
  border: 0;
  border-radius: 8px;
  background: #1a73e8;
  color: white;
}

button:disabled {
  background: #999;
}

#video {
  width: 100%;
  margin-top: 20px;
  background: black;
  border-radius: 8px;
}

#poruka {
  margin-top: 20px;
  padding: 15px;
  background: white;
  text-align: center;
  word-break: break-word;
}

#rezultat {
  margin-top: 15px;
  padding: 15px;
  background: white;
  display: none;
  word-break: break-word;
}

</style>

</head>

<body>

<h2>📷 Skeniranje računa</h2>

<button id="dugme"
        onclick="pokreniKameru()">

📷 SKENIRAJ KAMEROM

</button>

<video id="video"
       playsinline
       muted>
</video>

<div id="poruka">
Klikni na dugme i usmeri zadnju kameru telefona prema QR kodu.
</div>

<div id="rezultat"></div>


<script>


/* =====================================
   APPS SCRIPT
   ===================================== */

var APPS_SCRIPT_URL =
"https://script.google.com/macros/s/AKfycbzGIO_wqnYcT-Xbw_FgRkvxSFG3NhUlwppO1j8Z383SUT01KobEXG0CT9AcoYMt9ug05A/exec";


/* =====================================
   ELEMENTI
   ===================================== */

var video =
document.getElementById("video");

var poruka =
document.getElementById("poruka");

var dugme =
document.getElementById("dugme");

var rezultat =
document.getElementById("rezultat");


/* =====================================
   STANJE
   ===================================== */

var stream = null;

var zxingReader = null;

var zxingControls = null;

var skeniranje = false;

var slanje = false;


/* =====================================
   POKRETANJE KAMERE
   ===================================== */

async function pokreniKameru() {

  if (skeniranje) {
    return;
  }


  dugme.disabled = true;


  poruka.innerHTML =
    "📷 Pokrećem kameru...";


  try {

    /*
      Kameru pokrećemo samo ako
      još nije pokrenuta.
    */

    if (!stream) {

      stream =
        await navigator.mediaDevices.getUserMedia({

          video: {
            facingMode: {
              ideal: "environment"
            },

            width: {
              ideal: 1920
            },

            height: {
              ideal: 1080
            },

            frameRate: {
              ideal: 30
            }
          },

          audio: false

        });


      video.srcObject = stream;

      await video.play();

    }


    poruka.innerHTML =
      "🔍 Tražim QR kod...<br><br>" +
      "Približi telefon QR kodu " +
      "i drži ga mirno.";


    /*
      Pokrećemo QR čitač.
    */

    pokreniQR();


  }

  catch(error) {

    dugme.disabled = false;

    poruka.innerHTML =
      "❌ Kamera nije dostupna.<br><br>" +
      error;

  }

}


/* =====================================
   POKRETANJE QR ČITAČA
   ===================================== */

async function pokreniQR() {

  /*
    Ako postoji stari čitač,
    zaustavljamo samo njegovo
    skeniranje.

    NE gasimo kameru.
  */

  if (zxingControls) {

    try {

      zxingControls.stop();

    }

    catch(e) {}

    zxingControls = null;

  }


  skeniranje = true;


  try {

    /*
      Novi QR reader.
    */

    zxingReader =
      new ZXingBrowser.BrowserQRCodeReader();


    /*
      Čitamo postojeći video.

      VAŽNO:
      ovde NE tražimo novu kameru.
      Koristimo isti video i isti stream.
    */

    zxingControls =
      await zxingReader.decodeFromVideoElement(
        video,
        function(result, error) {

          if (!skeniranje) {
            return;
          }


          if (result) {

            var qrUrl =
              result.getText();


            if (qrUrl) {

              qrPronadjen(qrUrl);

            }

          }

        }
      );

  }

  catch(error) {

    skeniranje = false;

    dugme.disabled = false;


    console.log(
      "ZXing greška:",
      error
    );


    poruka.innerHTML =
      "❌ QR čitač nije pokrenut.<br><br>" +
      error;

  }

}


/* =====================================
   QR PRONAĐEN
   ===================================== */

function qrPronadjen(qrUrl) {

  if (!skeniranje) {
    return;
  }


  /*
    Sprečavamo da isti QR bude
    pročitan više puta dok traje obrada.
  */

  skeniranje = false;

  slanje = true;


  /*
    OVO JE VAŽNO:

    Ne koristimo reset().

    Ne gasimo kameru.

    Samo zaustavljamo QR skeniranje.
  */

  if (zxingControls) {

    try {

      zxingControls.stop();

    }

    catch(e) {}

    zxingControls = null;

  }


  poruka.innerHTML =
    "✓ QR KOD JE OČITAN!<br><br>" +
    "⏳ Upisujem račun...";


  rezultat.style.display =
    "block";


  rezultat.innerHTML =
    "Račun se šalje u Google tabelu...";


  /*
    Šaljemo QR URL Apps Script-u
    bez napuštanja ove stranice.
  */

  posaljiRacun(qrUrl);

}


/* =====================================
   SLANJE RAČUNA
   ===================================== */

function posaljiRacun(qrUrl) {

  var url =
    APPS_SCRIPT_URL +
    "?qr=" +
    encodeURIComponent(qrUrl);


  fetch(
    url,
    {
      method: "GET",
      mode: "no-cors",
      cache: "no-store"
    }
  )
  .then(function() {

    spremanZaSledeci();

  })
  .catch(function(error) {

    console.log(
      "Greška slanja:",
      error
    );


    /*
      I u slučaju da browser ne dozvoli
      čitanje odgovora, zahtev je poslat.
    */

    spremanZaSledeci();

  });

}


/* =====================================
   SPREMAN ZA SLEDEĆI RAČUN
   ===================================== */

function spremanZaSledeci() {

  setTimeout(function() {

    slanje = false;

    poruka.innerHTML =
      "📷 SPREMAN ZA SLEDEĆI RAČUN";


    rezultat.innerHTML =
      "✓ Račun je poslat.<br><br>" +
      "Sada približi sledeći QR kod.";


    /*
      Kamera je sve vreme uključena.

      Samo ponovo pokrećemo QR čitač.
    */

    dugme.disabled = false;

    pokreniQR();

  }, 1200);

}


/* =====================================
   GAŠENJE KAMERE
   ===================================== */

function ugasiKameru() {

  /*
    Ovo trenutno ne pozivamo
    tokom normalnog rada.

    Kamera ostaje uključena između
    dva računa.
  */

  if (zxingControls) {

    try {

      zxingControls.stop();

    }

    catch(e) {}

    zxingControls = null;

  }


  if (stream) {

    try {

      stream.getTracks().forEach(
        function(track) {

          track.stop();

        }
      );

    }

    catch(e) {}

    stream = null;

  }

}


</script>

</body>

</html>
