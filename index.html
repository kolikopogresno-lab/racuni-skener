<!DOCTYPE html>
<html lang="sr">

<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1">

<title>Skener računa</title>

<script src="https://unpkg.com/html5-qrcode@2.3.8"></script>

<style>

body {
  font-family: Arial, sans-serif;
  max-width: 600px;
  margin: auto;
  padding: 15px;
  background: #f5f5f5;
}

h2 {
  text-align: center;
}

button {
  width: 100%;
  padding: 16px;
  margin-top: 12px;
  font-size: 18px;
  border: 0;
  border-radius: 8px;
  background: #1a73e8;
  color: white;
}

#reader {
  width: 100%;
  margin-top: 20px;
}

#poruka {
  margin-top: 20px;
  padding: 15px;
  background: white;
  word-break: break-word;
  text-align: center;
}

#rezultat {
  margin-top: 15px;
  padding: 15px;
  background: white;
  display: none;
  word-break: break-word;
}

</style>

</head>

<body>

<h2>📷 Skeniranje računa</h2>

<button type="button"
        onclick="pokreniKameru()">

📷 SKENIRAJ KAMEROM

</button>

<div id="reader"></div>

<div id="poruka">
Izaberi kameru i usmeri je ka QR kodu računa.
</div>

<div id="rezultat"></div>


<script>

var skener = null;


/* =========================
   TVOJ APPS SCRIPT
   ========================= */

var APPS_SCRIPT_URL =
"https://script.google.com/macros/s/AKfycbzGIO_wqnYcT-Xbw_FgRkvxSFG3NhUlwppO1j8Z383SUT01KobEXG0CT9AcoYMt9ug05A/exec";


/* =========================
   KAMERA
   ========================= */

function pokreniKameru() {

  document.getElementById("poruka").innerHTML =
    "📷 Pokretanje kamere...";

  if (skener) {

    try {
      skener.stop();
    } catch(e) {}

  }

  skener = new Html5Qrcode(
    "reader",
    {
      verbose: false
    }
  );

  var config = {

    fps: 10,

    qrbox: function(width, height) {

      var size =
        Math.floor(
          Math.min(width, height) * 0.85
        );

      return {
        width: size,
        height: size
      };

    },

    formatsToSupport: [
      Html5QrcodeSupportedFormats.QR_CODE
    ]

  };


  skener.start(

    {
      facingMode: "environment"
    },

    config,

    function(decodedText) {

      obradiQR(decodedText);

      try {
        skener.stop();
      } catch(e) {}

    },

    function(errorMessage) {

      /* čeka QR kod */

    }

  )

  .catch(function(error) {

    document.getElementById("poruka").innerHTML =
      "GREŠKA KAMERE:<br><br>" +
      error;

  });

}


/* =========================
   QR JE OČITAN
   ========================= */

function obradiQR(qrUrl) {

  document.getElementById("poruka").innerHTML =
    "✓ QR KOD JE OČITAN!<br><br>" +
    "Šaljem podatke sa računa...";


  var rezultat =
    document.getElementById("rezultat");

  rezultat.style.display = "block";

  rezultat.innerHTML =
    "⏳ Obrada računa...";


  /*
     Otvaramo Apps Script
     i prosleđujemo QR URL.
  */

  var url =
    APPS_SCRIPT_URL +
    "?qr=" +
    encodeURIComponent(qrUrl);


  window.location.href = url;

}

</script>

</body>

</html>
