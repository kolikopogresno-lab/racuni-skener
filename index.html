<!DOCTYPE html>
<html lang="sr">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>SKENIRAJ RAČUN</title>

  <style>

    body {
      font-family: Arial, sans-serif;
      text-align: center;
      background: #f5f5f5;
      margin: 0;
      padding: 20px;
    }

    h1 {
      margin-bottom: 20px;
    }

    #reader {
      width: 100%;
      max-width: 500px;
      margin: auto;
      background: white;
      border-radius: 10px;
      overflow: hidden;
    }

    #poruka {
      margin-top: 20px;
      font-size: 18px;
      font-weight: bold;
    }

    #startButton {
      display: block;
      width: 100%;
      max-width: 400px;
      margin: 30px auto;
      padding: 18px;
      font-size: 22px;
      font-weight: bold;
      border: none;
      border-radius: 10px;
      background: #222;
      color: white;
    }

    #startButton:active {
      transform: scale(0.98);
    }

  </style>
</head>

<body>

  <h1>🧾 SKENIRAJ RAČUN</h1>

  <button
    id="startButton"
    onclick="pokreniKameru()"
  >
    📷 SKENIRAJ SLEDEĆI RAČUN
  </button>

  <div id="reader"></div>

  <div id="poruka">
    Pritisni dugme za pokretanje kamere
  </div>


  <script type="module">

    import {
      BrowserMultiFormatReader,
      NotFoundException
    } from
      "https://cdn.jsdelivr.net/npm/@zxing/browser@0.2.1/+esm";


    var APPS_SCRIPT_URL =
      "https://script.google.com/macros/s/AKfycbzGIO_wqnYcT-Xbw_FgRkvxSFG3NhUlwppO1j8Z383SUT01KobEXG0CT9AcoYMt9ug05A/exec";


    var codeReader = null;

    var controls = null;

    var kameraRadi = false;

    var vecSkenirano = false;


    function poruka(tekst) {

      document.getElementById(
        "poruka"
      ).innerText = tekst;

    }


    function dugme(tekst, prikazi) {

      var b =
        document.getElementById(
          "startButton"
        );

      b.innerText = tekst;

      b.style.display =
        prikazi ? "block" : "none";

    }


    async function pokreniKameru() {

      // Sprečava ponovno pokretanje
      // dok kamera već radi.
      if (kameraRadi) {
        return;
      }


      kameraRadi = true;

      vecSkenirano = false;


      dugme(
        "",
        false
      );


      poruka(
        "Pokrećem kameru..."
      );


      try {

        // Ako je prethodna kamera ostala aktivna,
        // potpuno je zaustavljamo.
        if (controls) {

          try {
            controls.stop();
          } catch (e) {}

          controls = null;
        }


        if (codeReader) {

          try {
            codeReader.reset();
          } catch (e) {}

        }


        codeReader =
          new BrowserMultiFormatReader();


        poruka(
          "Usmeri kameru na QR kod računa"
        );


        controls =
          await codeReader.decodeFromConstraints(

            {
              audio: false,

              video: {
                facingMode: "environment",

                width: {
                  ideal: 1280
                },

                height: {
                  ideal: 720
                }
              }
            },

            document.getElementById(
              "reader"
            ),

            function(result, error) {


              if (result && !vecSkenirano) {

                vecSkenirano = true;

                obradiQR(
                  result.getText()
                );

              }


              if (
                error &&
                !(error instanceof NotFoundException)
              ) {

                console.log(error);

              }

            }

          );

      }

      catch (greska) {

        console.error(
          greska
        );


        kameraRadi = false;


        poruka(
          "❌ Kamera nije dostupna."
        );


        dugme(
          "📷 POKUŠAJ PONOVO",
          true
        );

      }

    }


    function obradiQR(qrUrl) {


      poruka(
        "✅ QR očitan. Obrada računa..."
      );


      kameraRadi = false;


      // Zaustavljamo kameru odmah.
      if (controls) {

        try {
          controls.stop();
        } catch (e) {}

        controls = null;

      }


      if (codeReader) {

        try {
          codeReader.reset();
        } catch (e) {}

      }


      // Sakrivamo video.
      var reader =
        document.getElementById(
          "reader"
        );

      reader.innerHTML = "";


      // Otvaramo Apps Script.
      window.location.href =
        APPS_SCRIPT_URL +
        "?qr=" +
        encodeURIComponent(
          qrUrl
        );

    }


    // Ako se korisnik vrati na skener
    // preko Chrome dugmeta BACK,
    // pripremamo novu sesiju.
    window.addEventListener(
      "pageshow",
      function() {

        kameraRadi = false;

        vecSkenirano = false;

        dugme(
          "📷 SKENIRAJ SLEDEĆI RAČUN",
          true
        );

        poruka(
          "Pritisni dugme za skeniranje"
        );

      }
    );


  </script>

</body>
</html>
