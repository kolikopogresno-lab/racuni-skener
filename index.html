<!DOCTYPE html>
<html lang="sr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SKENIRAJ RAČUN</title>

  <style>
    body {
      font-family: Arial, sans-serif;
      text-align: center;
      background: #f5f5f5;
      margin: 0;
      padding: 20px;
    }

    h1 {
      margin-bottom: 20px;
    }

    #reader {
      width: 100%;
      max-width: 500px;
      margin: auto;
      background: white;
      border-radius: 10px;
      overflow: hidden;
    }

    #poruka {
      margin-top: 20px;
      font-size: 18px;
      font-weight: bold;
    }

    button {
      margin-top: 20px;
      padding: 14px 25px;
      font-size: 18px;
      border: none;
      border-radius: 8px;
      cursor: pointer;
    }
  </style>
</head>

<body>

  <h1>🧾 SKENIRAJ RAČUN</h1>

  <div id="reader"></div>

  <div id="poruka">Pokrećem kameru...</div>

  <script type="module">

    import {
      BrowserMultiFormatReader,
      NotFoundException
    } from
      "https://cdn.jsdelivr.net/npm/@zxing/browser@0.2.1/+esm";


    var APPS_SCRIPT_URL =
      "https://script.google.com/macros/s/AKfycbzGIO_wqnYcT-Xbw_FgRkvxSFG3NhUlwppO1j8Z383SUT01KobEXG0CT9AcoYMt9ug05A/exec";


    var codeReader = null;
    var controls = null;
    var skeniranje = false;


    function poruka(tekst) {
      document.getElementById("poruka").innerText = tekst;
    }


    async function pokreniKameru() {

      if (skeniranje) {
        return;
      }

      skeniranje = true;

      poruka("Pokrećem kameru...");


      try {

        // Ako je prethodna kamera ostala aktivna,
        // prvo je potpuno zaustavljamo.
        if (controls) {

          try {
            controls.stop();
          } catch (e) {}

          controls = null;
        }


        if (codeReader) {

          try {
            codeReader.reset();
          } catch (e) {}

        }


        codeReader =
          new BrowserMultiFormatReader();


        poruka("Usmeri kameru na QR kod računa");


        controls =
          await codeReader.decodeFromConstraints(

            {
              audio: false,

              video: {
                facingMode: {
                  ideal: "environment"
                },

                width: {
                  ideal: 1280
                },

                height: {
                  ideal: 720
                }
              }
            },

            document.getElementById("reader"),

            function(result, error) {

              if (result) {

                obradiQR(result.getText());

              }

              if (
                error &&
                !(error instanceof NotFoundException)
              ) {

                console.log(error);

              }

            }

          );

      }

      catch (greska) {

        console.error(greska);

        poruka(
          "❌ Kamera nije dostupna. Dozvoli pristup kameri."
        );

        skeniranje = false;
      }

    }


    function obradiQR(qrUrl) {

      // Sprečavamo drugo očitavanje
      // dok se prvi račun obrađuje.
      if (!skeniranje) {
        return;
      }

      skeniranje = false;


      poruka("✅ QR očitan. Obrada računa...");


      // ODMAH zaustavljamo kameru.
      if (controls) {

        try {
          controls.stop();
        } catch (e) {}

        controls = null;
      }


      if (codeReader) {

        try {
          codeReader.reset();
        } catch (e) {}

      }


      // Kratko čekamo da se kamera potpuno oslobodi,
      // pa tek onda prelazimo na Apps Script.
      setTimeout(function() {

        window.location.href =
          APPS_SCRIPT_URL +
          "?qr=" +
          encodeURIComponent(qrUrl);

      }, 300);

    }


    // Pokretanje kamere svaki put kada se stranica učita.
    window.addEventListener(
      "load",
      function() {

        setTimeout(
          pokreniKameru,
          300
        );

      }
    );


    // Ako se stranica vrati iz pozadine,
    // ponovo pokušavamo da pokrenemo kameru.
    document.addEventListener(
      "visibilitychange",
      function() {

        if (
          document.visibilityState === "visible" &&
          !skeniranje
        ) {

          setTimeout(
            pokreniKameru,
            500
          );

        }

      }
    );

  </script>

</body>
</html>
