<!DOCTYPE html>

<html lang="sr">

<head>

<meta charset="UTF-8">

<meta name="viewport"
   content="width=device-width, initial-scale=1">

<title>Skener računa</title>

<script src="https://unpkg.com/html5-qrcode@2.3.8"></script>

<style>

body {
  font-family: Arial, sans-serif;
  max-width: 600px;
  margin: auto;
  padding: 15px;
  background: #f5f5f5;
}

h2 {
  text-align: center;
}

button {
  width: 100%;
  padding: 16px;
  margin-top: 12px;
  font-size: 18px;
  border: 0;
  border-radius: 8px;
  background: #1a73e8;
  color: white;
}

#reader {
  width: 100%;
  margin-top: 20px;
}

#qr-input-file {
  width: 100%;
  padding: 15px;
  margin-top: 12px;
  font-size: 16px;
  box-sizing: border-box;
  background: white;
}

#poruka {
  margin-top: 20px;
  padding: 15px;
  background: white;
  word-break: break-all;
  text-align: center;
}

#rezultat {
  margin-top: 15px;
  padding: 15px;
  background: white;
  word-break: break-all;
  display: none;
}

</style>

</head>

<body>

<h2>📷 Skeniranje računa</h2>

<button type="button"
     onclick="pokreniKameru()">

📷 SKENIRAJ KAMEROM

</button>

<div id="reader"></div>

<input
id="qr-input-file"
type="file"
accept="image/*"
capture="environment">

<div id="poruka">

Izaberi kameru ili slikaj QR kod.

</div>

<div id="rezultat"></div>

<script>

var skener = null;


/* =========================
   KAMERA
   ========================= */

function pokreniKameru() {

  document.getElementById("poruka").innerHTML =
    "📷 Pokretanje kamere...";


  if (skener) {

    try {
      skener.stop();
    } catch(e) {}

  }


  skener =
    new Html5Qrcode(
      "reader",
      {
        verbose: false
      }
    );


  var config = {

    fps: 10,

    qrbox: function(width, height) {

      var size =
        Math.floor(
          Math.min(width, height) * 0.85
        );

      return {
        width: size,
        height: size
      };

    },

    formatsToSupport: [
      Html5QrcodeSupportedFormats.QR_CODE
    ]

  };


  skener.start(

    {
      facingMode: "environment"
    },

    config,

    function(decodedText) {

      prikaziQR(decodedText);

      skener.stop();

    },

    function(errorMessage) {

      /* čeka QR */

    }

  )

  .catch(function(error) {

    document.getElementById("poruka").innerHTML =
      "GREŠKA KAMERE:<br>" +
      error;

  });

}


/* =========================
   SLIKA QR KODA
   ========================= */

document
  .getElementById("qr-input-file")
  .addEventListener("change", function(event) {


    if (!event.target.files ||
        event.target.files.length === 0) {

      return;

    }


    var file =
      event.target.files[0];


    document.getElementById("poruka").innerHTML =
      "🔍 Čitam QR kod sa slike...";


    if (skener) {

      try {
        skener.clear();
      } catch(e) {}

    }


    skener =
      new Html5Qrcode(
        "reader"
      );


    skener
      .scanFile(file, true)

      .then(function(decodedText) {

        prikaziQR(decodedText);

      })

      .catch(function(error) {

        document.getElementById("poruka").innerHTML =
          "QR kod nije pronađen na slici.<br><br>" +
          "Probaj ponovo i fotografiši samo QR kod.";

      });

  });


/* =========================
   REZULTAT
   ========================= */

function prikaziQR(tekst) {

  document.getElementById("poruka").innerHTML =
    "✓ QR KOD JE OČITAN!";


  var rezultat =
    document.getElementById("rezultat");


  rezultat.style.display = "block";


  rezultat.innerHTML =
    "<b>QR sadržaj:</b><br><br>" +
    tekst;


  console.log(
    "QR:",
    tekst
  );

}

</script>

</body>

</html>
