<!DOCTYPE html>
<html lang="sr">

<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1">

<title>Skener računa</title>

<script src="https://unpkg.com/@zxing/browser@0.2.1"></script>

<style>

body {
  font-family: Arial, sans-serif;
  max-width: 600px;
  margin: auto;
  padding: 15px;
  background: #f5f5f5;
}

h2 {
  text-align: center;
}

button {
  width: 100%;
  padding: 17px;
  margin-top: 12px;
  font-size: 18px;
  border: 0;
  border-radius: 8px;
  background: #1a73e8;
  color: white;
}

button:disabled {
  background: #999;
}

#video {
  width: 100%;
  margin-top: 20px;
  background: black;
  border-radius: 8px;
}

#poruka {
  margin-top: 20px;
  padding: 15px;
  background: white;
  text-align: center;
  word-break: break-word;
}

#rezultat {
  margin-top: 15px;
  padding: 15px;
  background: white;
  display: none;
  word-break: break-word;
}

</style>

</head>

<body>

<h2>📷 Skeniranje računa</h2>

<button id="dugme"
        onclick="pokreniKameru()">

📷 SKENIRAJ KAMEROM

</button>

<video id="video"
       playsinline
       muted>
</video>

<div id="poruka">
Klikni na dugme i usmeri zadnju kameru telefona prema QR kodu.
</div>

<div id="rezultat"></div>


<script>


/* =====================================
   APPS SCRIPT
   ===================================== */

var APPS_SCRIPT_URL =
"https://script.google.com/macros/s/AKfycbzGIO_wqnYcT-Xbw_FgRkvxSFG3NhUlwppO1j8Z383SUT01KobEXG0CT9AcoYMt9ug05A/exec";


/* =====================================
   ELEMENTI
   ===================================== */

var video =
document.getElementById("video");

var poruka =
document.getElementById("poruka");

var dugme =
document.getElementById("dugme");

var rezultat =
document.getElementById("rezultat");


/* =====================================
   STANJE
   ===================================== */

var skeniranje = false;

var obrada = false;

var stream = null;

var zxingReader = null;

var zxingControls = null;

var animationFrame = null;


/* =====================================
   ZVUK
   ===================================== */

var audioContext = null;


function pustiZvuk() {

  try {

    if (!audioContext) {

      audioContext =
        new (
          window.AudioContext ||
          window.webkitAudioContext
        )();

    }


    if (
      audioContext.state === "suspended"
    ) {

      audioContext.resume();

    }


    var oscillator =
      audioContext.createOscillator();

    var gain =
      audioContext.createGain();


    oscillator.type = "sine";

    oscillator.frequency.value = 1200;

    gain.gain.value = 0.15;


    oscillator.connect(gain);

    gain.connect(
      audioContext.destination
    );


    oscillator.start();


    gain.gain.exponentialRampToValueAtTime(
      0.001,
      audioContext.currentTime + 0.18
    );


    oscillator.stop(
      audioContext.currentTime + 0.18
    );

  }

  catch(e) {

    console.log(
      "Zvuk nije dostupan:",
      e
    );

  }

}


/* =====================================
   VIBRACIJA
   ===================================== */

function vibriraj() {

  try {

    if (
      "vibrate" in navigator
    ) {

      navigator.vibrate(180);

    }

  }

  catch(e) {

    console.log(
      "Vibracija nije dostupna:",
      e
    );

  }

}


/* =====================================
   POKRETANJE KAMERE
   ===================================== */

async function pokreniKameru() {

  if (skeniranje || obrada) {
    return;
  }


  skeniranje = true;

  dugme.disabled = true;


  poruka.innerHTML =
    "📷 Pokrećem zadnju kameru...";


  try {

    /*
      Kameru tražimo samo ako već
      nemamo aktivan stream.
    */

    if (!stream) {

      stream =
        await navigator.mediaDevices.getUserMedia({

          video: {
            facingMode: {
              ideal: "environment"
            },

            width: {
              ideal: 1920
            },

            height: {
              ideal: 1080
            },

            frameRate: {
              ideal: 30
            },

            focusMode: "continuous"
          },

          audio: false

        });


      video.srcObject = stream;

      await video.play();

    }


    poruka.innerHTML =
      "🔍 Tražim QR kod...<br><br>" +
      "Približi telefon QR kodu " +
      "i drži ga mirno.";


    /*
      Prvo koristimo BarcodeDetector.
    */

    if ("BarcodeDetector" in window) {

      try {

        var podrzani =
          await BarcodeDetector.getSupportedFormats();


        if (
          podrzani.indexOf("qr_code") !== -1
        ) {

          pokreniNativeQR();

          return;

        }

      }

      catch(e) {

        console.log(
          "BarcodeDetector nije dostupan",
          e
        );

      }

    }


    /*
      Ako BarcodeDetector nije dostupan,
      koristimo ZXing.
    */

    pokreniZXing();

  }

  catch(error) {

    skeniranje = false;

    dugme.disabled = false;

    poruka.innerHTML =
      "❌ Kamera nije dostupna.<br><br>" +
      error;

  }

}


/* =====================================
   NATIVE QR
   ===================================== */

async function pokreniNativeQR() {

  var detector =
    new BarcodeDetector({
      formats: ["qr_code"]
    });


  async function proveriKadar() {

    if (!skeniranje) {
      return;
    }


    try {

      var kodovi =
        await detector.detect(video);


      if (
        kodovi &&
        kodovi.length > 0
      ) {

        var tekst =
          kodovi[0].rawValue;


        if (tekst) {

          qrPronadjen(tekst);

          return;

        }

      }

    }

    catch(e) {

      console.log(e);

    }


    animationFrame =
      requestAnimationFrame(
        proveriKadar
      );

  }


  proveriKadar();

}


/* =====================================
   ZXING
   ===================================== */

async function pokreniZXing() {

  try {

    zxingReader =
      new ZXingBrowser.BrowserQRCodeReader();


    zxingControls =
      await zxingReader.decodeFromVideoElement(
        video,
        function(result, error) {

          if (!skeniranje) {
            return;
          }


          if (result) {

            var tekst =
              result.getText();


            if (tekst) {

              qrPronadjen(tekst);

            }

          }

        }
      );

  }

  catch(error) {

    console.log(
      "ZXing greška:",
      error
    );

    poruka.innerHTML =
      "🔍 Kamera radi, ali QR još nije očitan.<br><br>" +
      "Drži QR kod unutar slike i približi ga telefonu.";

  }

}


/* =====================================
   QR JE OČITAN
   ===================================== */

function qrPronadjen(qrUrl) {

  if (!skeniranje) {
    return;
  }


  skeniranje = false;

  obrada = true;


  /*
    ZVUK I VIBRACIJA
    čim je QR uspešno očitan.
  */

  pustiZvuk();

  vibriraj();


  /*
    Zaustavljamo samo čitanje.
    Kameru NE gasimo.
  */

  if (animationFrame) {

    cancelAnimationFrame(
      animationFrame
    );

    animationFrame = null;

  }


  if (zxingControls) {

    try {

      zxingControls.stop();

    }

    catch(e) {}

    zxingControls = null;

  }


  poruka.innerHTML =
    "✓ QR KOD JE OČITAN!<br><br>" +
    "🔊 BIP + 📳 VIBRACIJA<br><br>" +
    "⏳ Upisujem račun...";


  rezultat.style.display =
    "block";


  rezultat.innerHTML =
    "Račun se šalje u Google tabelu...";


  /*
    Šaljemo račun u pozadini.
    Stranica se NE NAPUŠTA.
  */

  posaljiRacun(qrUrl);

}


/* =====================================
   SLANJE U APPS SCRIPT
   ===================================== */

function posaljiRacun(qrUrl) {

  var url =
    APPS_SCRIPT_URL +
    "?qr=" +
    encodeURIComponent(qrUrl);

  fetch(url, {
    method: "GET",
    mode: "no-cors"
  })
  .then(function() {

    rezultat.innerHTML =
      "✓ Račun je poslat u Google tabelu.<br><br>" +
      "Pripremam sledeći račun...";

    setTimeout(function() {
      spremanZaSledeci();
    }, 2000);

  })
  .catch(function(error) {

    rezultat.innerHTML =
      "❌ Greška pri slanju računa.<br><br>" +
      error;

  });
}

/* =====================================
   SLEDEĆI RAČUN
   ===================================== */

function spremanZaSledeci() {

  obrada = false;

  skeniranje = true;

  dugme.disabled = true;


  poruka.innerHTML =
    "📷 SPREMAN ZA SLEDEĆI RAČUN";


  rezultat.innerHTML =
    "✓ Račun je poslat.<br><br>" +
    "Približi sledeći QR kod.";


  /*
    Ponovo pokrećemo BarcodeDetector
    nad ISTOM kamerom.
  */

  if ("BarcodeDetector" in window) {

    pokreniNativeQR();

  }

  else {

    pokreniZXing();

  }

}


/* =====================================
   GAŠENJE KAMERE
   ===================================== */

function ugasiKameru() {

  if (animationFrame) {

    cancelAnimationFrame(
      animationFrame
    );

    animationFrame = null;

  }


  if (zxingControls) {

    try {

      zxingControls.stop();

    }

    catch(e) {}

    zxingControls = null;

  }


  if (stream) {

    try {

      stream.getTracks().forEach(
        function(track) {

          track.stop();

        }
      );

    }

    catch(e) {}

    stream = null;

  }

}


</script>

</body>

</html>
