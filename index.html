<!DOCTYPE html>
<html lang="sr">

<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1">

<title>Skener računa</title>

<script src="https://unpkg.com/@zxing/browser@0.2.1"></script>

<style>

body {
  font-family: Arial, sans-serif;
  max-width: 600px;
  margin: auto;
  padding: 15px;
  background: #f5f5f5;
}

h2 {
  text-align: center;
}

button {
  width: 100%;
  padding: 17px;
  margin-top: 12px;
  font-size: 18px;
  border: 0;
  border-radius: 8px;
  background: #1a73e8;
  color: white;
}

button:disabled {
  background: #999;
}

#video {
  width: 100%;
  margin-top: 20px;
  background: black;
  border-radius: 8px;
}

#poruka {
  margin-top: 20px;
  padding: 15px;
  background: white;
  text-align: center;
  word-break: break-word;
}

#rezultat {
  margin-top: 15px;
  padding: 15px;
  background: white;
  display: none;
  word-break: break-word;
}

</style>

</head>

<body>

<h2>📷 Skeniranje računa</h2>

<button id="dugme"
        onclick="pokreniKameru()">

📷 POKRENI KAMERU

</button>

<video id="video"
       playsinline
       muted>
</video>

<div id="poruka">
Klikni na dugme i usmeri zadnju kameru telefona prema QR kodu.
</div>

<div id="rezultat"></div>


<script>

/* =====================================
   APPS SCRIPT
   ===================================== */

var APPS_SCRIPT_URL =
"https://script.google.com/macros/s/AKfycbzGIO_wqnYcT-Xbw_FgRkvxSFG3NhUlwppO1j8Z383SUT01KobEXG0CT9AcoYMt9ug05A/exec";


/* =====================================
   PROMENLJIVE
   ===================================== */

var video =
document.getElementById("video");

var poruka =
document.getElementById("poruka");

var dugme =
document.getElementById("dugme");

var skeniranje = false;

var obrada = false;

var stream = null;

var zxingReader = null;

var zxingControls = null;

var animationFrame = null;


/* =====================================
   POKRETANJE KAMERE
   ===================================== */

async function pokreniKameru() {

  if (skeniranje || obrada) {
    return;
  }


  skeniranje = true;

  dugme.disabled = true;


  poruka.innerHTML =
    "📷 Pokrećem kameru...";


  try {

    /*
      KAMERU POKREĆEMO SAMO PRVI PUT.

      Kod sledećih računa isti video stream
      ostaje aktivan.
    */

    if (!stream) {

      stream =
        await navigator.mediaDevices.getUserMedia({

          video: {
            facingMode: {
              ideal: "environment"
            },

            width: {
              ideal: 1920
            },

            height: {
              ideal: 1080
            },

            frameRate: {
              ideal: 30
            }
          },

          audio: false

        });


      video.srcObject = stream;

      await video.play();

    }


    poruka.innerHTML =
      "🔍 Tražim QR kod...<br><br>" +
      "Približi telefon QR kodu " +
      "i drži ga mirno.";


    /*
      Prvo probamo ugrađeni čitač.
    */

    if ("BarcodeDetector" in window) {

      try {

        var podrzani =
          await BarcodeDetector.getSupportedFormats();

        if (
          podrzani.indexOf("qr_code") !== -1
        ) {

          pokreniNativeQR();

          return;

        }

      }

      catch(e) {

        console.log(
          "BarcodeDetector nije dostupan",
          e
        );

      }

    }


    /*
      Ako nema ugrađenog čitača,
      koristimo ZXing.
    */

    pokreniZXing();

  }

  catch(error) {

    skeniranje = false;

    dugme.disabled = false;

    poruka.innerHTML =
      "❌ Kamera nije dostupna.<br><br>" +
      error;

  }

}


/* =====================================
   BARCODE DETECTOR
   ===================================== */

async function pokreniNativeQR() {

  var detector =
    new BarcodeDetector({
      formats: ["qr_code"]
    });


  async function proveriKadar() {

    if (!skeniranje) {
      return;
    }


    try {

      var kodovi =
        await detector.detect(video);


      if (
        kodovi &&
        kodovi.length > 0
      ) {

        var tekst =
          kodovi[0].rawValue;


        if (tekst) {

          uspeh(tekst);

          return;

        }

      }

    }

    catch(e) {

      console.log(e);

    }


    animationFrame =
      requestAnimationFrame(
        proveriKadar
      );

  }


  proveriKadar();

}


/* =====================================
   ZXING
   ===================================== */

async function pokreniZXing() {

  try {

    if (zxingControls) {

      try {
        zxingControls.stop();
      }

      catch(e) {}

      zxingControls = null;

    }


    if (zxingReader) {

      try {
        zxingReader.reset();
      }

      catch(e) {}

    }


    zxingReader =
      new ZXingBrowser.BrowserQRCodeReader();


    zxingControls =
      await zxingReader.decodeFromVideoElement(
        video,
        function(result, error) {

          if (!skeniranje) {
            return;
          }


          if (result) {

            var tekst =
              result.getText();


            if (tekst) {

              uspeh(tekst);

            }

          }

        }
      );

  }

  catch(error) {

    console.log(
      "ZXing greška:",
      error
    );


    poruka.innerHTML =
      "🔍 Kamera radi, ali QR još nije očitan.<br><br>" +
      "Drži QR kod unutar slike i približi ga telefonu.";

  }

}


/* =====================================
   QR JE OČITAN
   ===================================== */

function uspeh(qrUrl) {

  if (!skeniranje) {
    return;
  }


  /*
    ODMAH zaustavljamo samo QR čitanje.

    KAMERA OSTAjE UKLJUČENA.
  */

  skeniranje = false;

  obrada = true;


  if (animationFrame) {

    cancelAnimationFrame(
      animationFrame
    );

    animationFrame = null;

  }


  if (zxingControls) {

    try {
      zxingControls.stop();
    }

    catch(e) {}

    zxingControls = null;

  }


  if (zxingReader) {

    try {
      zxingReader.reset();
    }

    catch(e) {}

  }


  poruka.innerHTML =
    "✓ QR KOD JE OČITAN!<br><br>" +
    "⏳ Upisujem račun u tabelu...";


  /*
    Prikazujemo poruku.
  */

  document.getElementById("rezultat")
    .style.display = "block";


  document.getElementById("rezultat")
    .innerHTML =
    "Račun se šalje na obradu.";


  /*
    NAJVAŽNIJA IZMENA:

    Ne koristimo window.location.href.

    Stranica skenera ostaje otvorena.

    Apps Script dobija QR URL u pozadini.
  */

  posaljiNaAppsScript(qrUrl);

}


/* =====================================
   SLANJE QR-a U APPS SCRIPT
   ===================================== */

function posaljiNaAppsScript(qrUrl) {

  var url =
    APPS_SCRIPT_URL +
    "?qr=" +
    encodeURIComponent(qrUrl);


  /*
    fetch sa no-cors režimom omogućava
    da pošaljemo GET zahtev bez napuštanja
    stranice skenera.
  */

  fetch(
    url,
    {
      method: "GET",
      mode: "no-cors",
      cache: "no-store"
    }
  )
  .then(function() {

    pripremiSledeciSken();

  })
  .catch(function(error) {

    console.log(
      "Greška pri slanju:",
      error
    );

    /*
      Čak i ako browser ne dozvoli
      čitanje odgovora, zahtev je poslat.
      Zato pripremamo sledeće skeniranje.
    */

    pripremiSledeciSken();

  });

}


/* =====================================
   SLEDEĆI SKEN
   ===================================== */

function pripremiSledeciSken() {

  setTimeout(function() {

    obrada = false;

    skeniranje = false;

    dugme.disabled = false;


    document.getElementById("rezultat")
      .innerHTML =
      "✅ Račun je poslat.<br><br>" +
      "Spreman za sledeći račun.";


    poruka.innerHTML =
      "📷 Spreman za sledeći račun.";


    /*
      KAMERA JE I DALJE UKLJUČENA.

      Samo ponovo pokrećemo
      prepoznavanje QR koda.
    */

    pokreniKameru();

  }, 1500);

}


/* =====================================
   ZAUSTAVLJANJE KAMERE
   ===================================== */

function zaustaviKameru() {

  if (animationFrame) {

    cancelAnimationFrame(
      animationFrame
    );

    animationFrame = null;

  }


  try {

    if (zxingControls) {

      zxingControls.stop();

      zxingControls = null;

    }

  }

  catch(e) {}


  try {

    if (zxingReader) {

      zxingReader.reset();

      zxingReader = null;

    }

  }

  catch(e) {}


  try {

    if (stream) {

      stream.getTracks().forEach(
        function(track) {

          track.stop();

        }
      );

      stream = null;

    }

  }

  catch(e) {}

}

</script>

</body>

</html>
