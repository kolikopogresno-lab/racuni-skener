<!DOCTYPE html>

<html lang="sr">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>Skener računa</title>

<script src="https://unpkg.com/@zxing/library@0.21.3"></script>

<style>

body {
  font-family: Arial, sans-serif;
  max-width: 600px;
  margin: auto;
  padding: 15px;
  background: #f5f5f5;
}

h2 {
  text-align: center;
}

button {
  width: 100%;
  padding: 16px;
  margin-top: 15px;
  font-size: 18px;
  border: 0;
  border-radius: 8px;
  background: #1a73e8;
  color: white;
}

video {
  width: 100%;
  margin-top: 20px;
  background: black;
}

#poruka {
  margin-top: 20px;
  padding: 15px;
  background: white;
  text-align: center;
  word-break: break-all;
}

</style>

</head>

<body>

<h2>📷 Skeniranje računa</h2>

<button id="startButton">
  SKENIRAJ QR KOD
</button>

<video id="video" playsinline></video>

<div id="poruka">
  Pritisni dugme za pokretanje kamere.
</div>

<script>

var codeReader = null;

var videoElement =
  document.getElementById("video");

var poruka =
  document.getElementById("poruka");


document.getElementById("startButton")
.addEventListener("click", function() {

  poruka.innerHTML =
    "📷 Kamera radi — usmeri je prema QR kodu.";

  codeReader =
    new ZXing.BrowserQRCodeReader();


  codeReader.decodeFromConstraints(

    {
      video: {
        facingMode: {
          ideal: "environment"
        },
        width: {
          ideal: 1920
        },
        height: {
          ideal: 1080
        }
      }
    },

    videoElement,

    function(result, error) {

      if (result) {

        var tekst =
          result.getText();

        poruka.innerHTML =
          "<b>✓ QR KOD JE OČITAN!</b><br><br>" +
          "<small>" +
          tekst +
          "</small>";


        codeReader.reset();

      }

    }

  )

  .catch(function(error) {

    poruka.innerHTML =
      "<b>GREŠKA:</b><br>" +
      error;

  });

});

</script>

</body>
</html>
